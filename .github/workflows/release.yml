name: Windows portable
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ghostwave-windows-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked downloads
        run: |
          if (git ls-files installer/) { throw 'installer/ must never be tracked.' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Prepare pinned dependencies
        run: ./ci/dependencies.ps1
      - name: Capture historical reference
        run: ./ci/oracle.ps1
      - name: Configure native application
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile native application
        run: cmake --build build --config Release --parallel 4
      - name: Validate native compatibility
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native compatibility checks failed.' }
      - name: Package and smoke test
        run: ./ci/package.ps1
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/release.ps1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            ci-output/dependencies.json
            ci-output/reference-hashes.json
            ci-output/reference/
            ci-output/native-results.json
            ci-output/native/
            ci-output/ui-results.json
            build/Testing/Temporary/LastTest.log
          retention-days: 30
          if-no-files-found: warn
