name: Windows portable
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full source SHA for a missing automatic run
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: ghostwave-windows-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate recovery identity
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if ($env:EXPECTED_SHA -ne $env:GITHUB_SHA) { throw 'Recovery SHA does not match the checked out commit.' }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked downloads
        run: ./ci/source-check.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/cache@v4
        with:
          path: vendor/archives
          key: windows-dependency-downloads-${{ hashFiles('ci/dependencies.ps1', 'ci/oracle-requirements.txt') }}
      - name: Prepare pinned dependencies
        run: ./ci/dependencies.ps1
      - name: Restore patched media build
        id: media_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/media/ffmpeg.exe
            vendor/media-packages.txt
            ci-output/media-config.log
            ci-output/media-imports.txt
          key: windows-media-${{ hashFiles('ci/build-media.sh', 'ci/ffmpeg-vibrato.patch', 'ci/dependencies.ps1') }}
      - uses: msys2/setup-msys2@v2
        if: steps.media_cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make patch
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rubberband
            mingw-w64-ucrt-x86_64-lame
            mingw-w64-ucrt-x86_64-chromaprint
      - name: Compile patched FFmpeg
        id: media
        if: steps.media_cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash ci/build-media.sh
      - name: Cache patched media build
        if: steps.media.outcome == 'success' && steps.media_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/media/ffmpeg.exe
            vendor/media-packages.txt
            ci-output/media-config.log
            ci-output/media-imports.txt
          key: ${{ steps.media_cache.outputs.cache-primary-key }}
      - name: Verify dependency provenance
        run: ./ci/record-dependencies.ps1
      - name: Capture historical reference
        run: ./ci/oracle.ps1
      - name: Identify runner image
        id: image
        run: '"version=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'
      - name: Restore native dependency build
        id: native_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/wxWidgets
            build
          key: windows-native-${{ steps.image.outputs.version }}-${{ hashFiles('CMakeLists.txt', 'ci/dependencies.ps1') }}
          restore-keys: windows-native-${{ steps.image.outputs.version }}-
      - name: Configure native application
        id: configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Compile native application
        id: compile
        run: cmake --build build --config Release --parallel 4
      - name: Validate frozen reference
        if: always() && steps.compile.outcome == 'success'
        run: ./ci/check-reference.ps1
      - name: Validate native compatibility
        if: always() && steps.compile.outcome == 'success'
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Native compatibility checks failed.' }
      - name: Validate profile rollback
        if: always() && steps.compile.outcome == 'success'
        run: ./ci/check-profile.ps1
      - name: Validate native accessibility
        if: always() && steps.compile.outcome == 'success'
        run: |
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File ci/ui-smoke.ps1 -PortablePath build/bin/Release
          if ($LASTEXITCODE -ne 0) { throw 'Native accessibility checks failed.' }
      - name: Package and smoke test
        run: ./ci/package.ps1
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/release.ps1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            ci-output/dependencies.json
            ci-output/media-config.log
            ci-output/media-imports.txt
            ci-output/reference-hashes.json
            ci-output/reference-verification.json
            ci-output/reference/
            ci-output/native-results.json
            ci-output/profile-results.json
            ci-output/native/
            ci-output/ui-results.json
            build/Testing/Temporary/LastTest.log
          retention-days: 30
          if-no-files-found: warn
      - name: Cache native dependency build
        if: always() && steps.configure.outcome == 'success' && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/wxWidgets
            build
          key: ${{ steps.native_cache.outputs.cache-primary-key }}
